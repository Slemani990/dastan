<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>your24chance</title>
    <style>
      body {
        background-color: #0e0e0e;
        color: #ffffff;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 20px;
      }

      #timer {
        font-size: 2rem;
        background: #111;
        padding: 20px 40px;
        border-radius: 10px;
        border: 2px solid #444;
      }
    </style>
  </head>
  <body>
    <h1>🎲 Welcome to Your24Chance</h1>
    <div id="timer">Loading timer...</div>

    <script>
      function start24HourTimer() {
        const now = new Date().getTime();
        const end = now + 24 * 60 * 60 * 1000;

        const timerEl = document.getElementById("timer");

        const x = setInterval(function () {
          const current = new Date().getTime();
          const distance = end - current;

          const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((distance % (1000 * 60)) / 1000);

          timerEl.innerHTML = `${hours}h ${minutes}m ${seconds}s`;

          if (distance < 0) {
            clearInterval(x);
            timerEl.innerHTML = "💥 Time's up!";
          }
        }, 1000);
      }

      start24HourTimer();
    </script>
  </body>

  <body>
    <h1>🎲 Welcome to Your24Chance</h1>
    <div id="timer">Loading timer...</div>

    <!-- و -->
    <audio id="alarmSound" preload="auto">
      <source src="https://www.soundjay.com/button/beep-07.mp3" type="audio/mpeg" />
    </audio>

    <script>
      function start24HourTimer() {
        const now = new Date().getTime();
        const end = now + 24 * 60 * 60 * 1000;

        const timerEl = document.getElementById("timer");
        const sound = document.getElementById("alarmSound");

        const x = setInterval(function () {
          const current = new Date().getTime();
          const distance = end - current;

          const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((distance % (1000 * 60)) / 1000);

          timerEl.innerHTML = `${hours}h ${minutes}m ${seconds}s`;

          if (distance < 0) {
            clearInterval(x);
            timerEl.innerHTML = "💥 Time's up!";
            sound.play();
          }
        }, 1000);
      }

      start24HourTimer();
    </script>
  </body>
